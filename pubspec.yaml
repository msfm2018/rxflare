name: rxflare
description: A high-performance reactive state management library for Flutter featuring automatic dependency tracking and granular field-level updates.
version: 1.5.0
homepage: https://github.com/msfm2018/rxflare
repository: https://github.com/msfm2018/rxflare
issue_tracker: https://github.com/msfm2018/rxflare/issues

topics:
  - state-management
  - reactive
  - flutter-widgets
  - performance

environment:
  sdk: '>=3.0.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

devtools:
  extensions:
    - name: rxflare
      version: 1.0.0
      path: extension/devtools

example: example/lib/main.dart